  <!-- Brand Orange Tile -->
  <rect width="64" height="64" rx="14" fill="#E56315"/>
  <!-- Deep Navy 'S' -->
  <text x="18" y="46" font-family="'Manrope', -apple-system, sans-serif" font-weight="800" font-size="38" fill="#0A034C">S</text>
  <!-- Subtle accent notch -->
  <circle cx="48" cy="16" r="3.5" fill="#FFFFFF"/>
</svg>
